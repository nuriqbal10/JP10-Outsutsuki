<div id="printReportModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-md hidden flex items-center justify-center p-2 sm:p-4 overflow-y-auto">
    <div class="w-full max-w-4xl max-h-[96vh] flex flex-col overflow-hidden animate-modal-pop shadow-2xl relative my-auto">
      
      <!-- Top Action Bar (Screen Only) -->
      <div class="no-print bg-slate-900/90 text-white p-4 rounded-t-2xl flex items-center justify-between gap-4 backdrop-blur-md border border-slate-700">
        <div class="flex items-center gap-2">
          <span class="text-lg">🖨️</span>
          <div>
            <h3 class="font-extrabold text-sm">Lembar Rapor Siswa Resmi (Format A4)</h3>

        </div>

        <div class="flex items-center gap-2">

            <span>🖨️ Cetak / Simpan PDF</span>
          </button>
          
          <button onclick="closePrintModal()" class="w-9 h-9 rounded-xl bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center font-bold text-sm">

          </button>

      </div>

      <!-- Printable A4 Paper Container -->
      <div class="overflow-y-auto bg-slate-200/50 dark:bg-slate-900/50 p-2 sm:p-6 flex justify-center">
        
        <div id="print-certificate-paper" class="bg-white text-slate-900 w-full max-w-[210mm] min-h-[280mm] p-6 sm:p-8 rounded-xl shadow-2xl border-4 border-double border-slate-900 font-sans space-y-4 text-xs leading-relaxed relative">

            <div class="w-14 h-14 p-1 shrink-0 flex items-center justify-center border border-slate-300 rounded-lg">
              <img src="/logo_outsutsuki.png
