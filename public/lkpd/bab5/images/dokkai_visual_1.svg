<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="auto" font-family="'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif">
  <rect x="10" y="10" width="780" height="500" rx="14" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
  <rect x="10" y="10" width="780" height="70" rx="14" fill="#15803d"/>
  <rect x="25" y="22" width="45" height="45" rx="6" fill="#ffffff"/>
  <text x="47" y="55" font-size="34" text-anchor="middle" fill="#15803d" font-weight="bold">十</text>
  <text x="85" y="45" fill="#ffffff" font-size="22" font-weight="bold">【工場安全衛生標識】安全第一 (Safety First)</text>
  <text x="85" y="66" fill="#bbf7d0" font-size="13">第5課：製造現場ルール ＆ 緊急時避難手順</text>
  <rect x="30" y="95" width="235" height="260" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="30" y="95" width="235" height="35" rx="10" fill="#2563eb"/>
  <text x="147" y="120" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">保護具着用 (PPE)</text>
  <circle cx="147" cy="180" r="40" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="147" y="195" font-size="40" text-anchor="middle">⛑️</text>
  <text x="147" y="250" fill="#1e3a8a" font-size="15" font-weight="bold" text-anchor="middle">ヘルメット・保護メガネ</text>
  <text x="147" y="272" fill="#1e3a8a" font-size="15" font-weight="bold" text-anchor="middle">安全靴を必ず着用！</text>
  <text x="147" y="305" fill="#64748b" font-size="11" text-anchor="middle">作業場内ノーヘル立入禁止</text>
  <text x="147" y="325" fill="#b91c1c" font-size="11" font-weight="bold" text-anchor="middle">※あご紐を確実に締めること</text>
  <rect x="282" y="95" width="235" height="260" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="282" y="95" width="235" height="35" rx="10" fill="#dc2626"/>
  <text x="399" y="120" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">火気厳禁 (No Open Fire)</text>
  <circle cx="399" cy="180" r="40" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="399" y="195" font-size="40" text-anchor="middle">🔥</text>
  <text x="399" y="250" fill="#991b1b" font-size="16" font-weight="bold" text-anchor="middle">たばこ・マッチ・ライター</text>
  <text x="399" y="275" fill="#991b1b" font-size="16" font-weight="bold" text-anchor="middle">火気使用絶対禁止！</text>
  <text x="399" y="305" fill="#64748b" font-size="11" text-anchor="middle">塗料・シンナー・可燃性ガス保管庫</text>
  <text x="399" y="325" fill="#b91c1c" font-size="11" font-weight="bold" text-anchor="middle">※喫煙は指定の喫煙所のみ</text>
  <rect x="535" y="95" width="235" height="260" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="535" y="95" width="235" height="35" rx="10" fill="#d97706"/>
  <text x="652" y="120" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">作動中・手出し禁止</text>
  <circle cx="652" cy="180" r="40" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="652" y="195" font-size="40" text-anchor="middle">⚠️</text>
  <text x="652" y="250" fill="#92400e" font-size="16" font-weight="bold" text-anchor="middle">巻き込まれ注意！</text>
  <text x="652" y="275" fill="#92400e" font-size="14" font-weight="bold" text-anchor="middle">機械停止後に触ること</text>
  <text x="652" y="305" fill="#64748b" font-size="11" text-anchor="middle">異音・異常時は非常停止ボタンを押す</text>
  <text x="652" y="325" fill="#b91c1c" font-size="11" font-weight="bold" text-anchor="middle">※軍手をしたままの回転体操作禁止</text>
  <rect x="30" y="370" width="740" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="30" y="370" width="740" height="32" rx="10" fill="#fee2e2"/>
  <text x="45" y="392" fill="#991b1b" font-size="14" font-weight="bold">🚨 【緊急時の行動手順】怪我・火災・地震が発生したら！</text>
  <text x="45" y="425" fill="#0f172a" font-size="13" font-weight="bold">1. 大声で知らせる：</text>
  <text x="180" y="425" fill="#334155" font-size="13">「火事だ！」「止めてください！」と周囲に大きな声で伝える。</text>
  <text x="45" y="450" fill="#0f172a" font-size="13" font-weight="bold">2. 非常停止ボタン：</text>
  <text x="180" y="450" fill="#334155" font-size="13">コンベア赤色ボタンを押して直ちに機械を完全停止させる。</text>
  <text x="45" y="475" fill="#0f172a" font-size="13" font-weight="bold">3. 避難と点呼：</text>
  <text x="180" y="475" fill="#b91c1c" font-size="13" font-weight="bold">非常口（緑のマーク）から屋外の第1駐車場へ避難し、班長へ点呼報告する。</text>
</svg>