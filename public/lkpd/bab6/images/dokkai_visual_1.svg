  <text x="60" y="402" fill="#0f172a" font-size="14" font-weight="bold">🗺️ 乗り換え・乗車マナーのご案内</text>
  <text x="60" y="428" fill="#334155" font-size="12">① 東京駅では「新幹線南のりかえ口」の自動改札機に、乗車券と特急券を重ねて2枚一緒に入れてください。</text>
  <text x="60" y="452" fill="#334155" font-size="12">② 15番線ホームへ上がり、足元の「7号車・乗車位置」の青色ラインに並んでお待ちください。</text>
  <text x="60" y="476" fill="#b91c1c" font-size="12" font-weight="bold">③ 車内では携帯電話を通話モードにせずマナーモードに設定し、通話はデッキにてお願いいたします。</text>
