  <text x="245" y="195" fill="#558b2f" font-size="11">(大阪市内)</text>
  <rect x="60" y="215" width="420" height="70" rx="6" fill="#ffffff" stroke="#c8e6c9"/>
  <text x="75" y="240" fill="#1b5e20" font-size="15" font-weight="bold">ひかり 643号 (Hikari 643)</text>
  <text x="75" y="265" fill="#33691e" font-size="13">10月24日　<tspan font-weight="bold" font-size="16" fill="#d32f2f">10:33 発</tspan>　➔　13:28 着</text>
  <text x="320" y="240" fill="#b71c1c" font-size="18" font-weight="bold">7号車 12番 A席</text>
  <text x="330" y="262" fill="#757575" font-size="11">(普通車・禁煙・窓側)</text>
  <text x="60" y="315" fill="#2e7d32" font-size="14" font-weight="bold">￥14,400 (運賃 8,910円 / 特急料金 5,490円)</text>
  <text x="60" y="338" fill="#757575" font-size="10">2026.10.15 東京駅MV発行　幹入調4311　変更は1回に限り有効</text>
  <rect x="520" y="95" width="240" height="260" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="520" y="95" width="240" height="35" rx="10" fill="#0f172a"/>
  <text x="640" y="118" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">東京駅 新幹線発車案内板</text>
  <rect x="530" y="140" width="220" height="40" rx="4" fill="#334155"/>
  <text x="540" y="158" fill="#facc15" font-size="12" font-weight="bold">10:30 のぞみ 25号</text>
  <text x="540" y="173" fill="#cbd5e1" font-size="10">博多行　14番線</text>
  <text x="710" y="165" fill="#22c55e" font-size="11" font-weight="bold">定刻</text>
  <rect x="530" y="190" width="220" height="45" rx="4" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="540" y="208" fill="#ffffff" font-size="13" font-weight="bold">10:33 ひかり 643号</text>
  <text x="540" y="225" fill="#e0f2fe" font-size="11">新大阪行　<tspan fill="#facc15" font-weight="bold" font-size="13">15番線</tspan></text>
  <text x="705" y="215" fill="#fde047" font-size="11" font-weight="bold">乗車中</text>
  <text x="530" y="260" fill="#94a3b8" font-size="11">• 自由席：1〜5号車</text>
  <text x="530" y="280" fill="#94a3b8" font-size="11">• 指定席：6〜16号車 (7号車は指定)</text>
  <text x="530" y="305" fill="#ef4444" font-size="11" font-weight="bold">※発車2分前に扉が閉まります。</text>
