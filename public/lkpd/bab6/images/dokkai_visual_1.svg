  <text x="60" y="125" fill="#2e7d32" font-size="13" font-weight="bold">JR東海道・山陽新幹線　指定席特急券・乗車券</text>
  <text x="470" y="125" fill="#66bb6a" font-size="11" text-anchor="end">[トク特] 幹指定</text>
  <text x="80" y="175" fill="#1b5e20" font-size="26" font-weight="bold">東 京</text>
  <text x="175" y="170" fill="#2e7d32" font-size="18">▶▶▶</text>
  <text x="245" y="175" fill="#1b5e20" font-size="26" font-weight="bold">新大阪</text>
