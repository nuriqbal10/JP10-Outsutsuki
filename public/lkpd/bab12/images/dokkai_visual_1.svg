<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="auto" font-family="'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif">
  <rect x="10" y="10" width="780" height="500" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="10" y="10" width="780" height="65" rx="14" fill="#0284c7"/>
  <text x="30" y="48" fill="#ffffff" font-size="22" font-weight="bold">【家電製品】電子レンジ取扱説明書 ＆ 安全上のご注意</text>
  <text x="760" y="48" fill="#e0f2fe" font-size="14" text-anchor="end">第12課：機器の操作</text>
  <rect x="35" y="90" width="460" height="400" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="35" y="90" width="460" height="38" rx="10" fill="#f0f9ff"/>
  <text x="50" y="115" fill="#0369a1" font-size="15" font-weight="bold">📖 電子レンジ（MW-200）安全にお使いいただくために</text>
  <rect x="50" y="145" width="430" height="150" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="65" y="170" fill="#991b1b" font-size="14" font-weight="bold">🚫 【絶対に入れてはいけないもの】（火災・破裂の危険！）</text>
  <text x="65" y="195" fill="#1e293b" font-size="12">• <tspan fill="#b91c1c" font-weight="bold">アルミホイルや金属製の食器・缶詰：</tspan> 火花が飛び散り発火します。</text>
  <text x="65" y="218" fill="#1e293b" font-size="12">• <tspan fill="#b91c1c" font-weight="bold">殻付きの生卵・ゆで卵：</tspan> 内部圧力で激しく破裂し扉が破損します。</text>
  <text x="65" y="240" fill="#1e293b" font-size="12">• <tspan fill="#b91c1c" font-weight="bold">密閉されたビンや缶：</tspan> フタを必ず取ってから温めてください。</text>
  <text x="65" y="262" fill="#1e293b" font-size="12">• <tspan fill="#b91c1c" font-weight="bold">何も入れない状態での空だき：</tspan> 故障・火災の原因になります。</text>
  <text x="65" y="283" fill="#64748b" font-size="11">※プラスチック容器は「電子レンジ対応」マークをご確認ください。</text>
  <rect x="50" y="310" width="430" height="160" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="65" y="335" fill="#166534" font-size="13" font-weight="bold">💡 【上手なあたため・解凍のコツ】</text>
  <text x="65" y="360" fill="#1e293b" font-size="12">1. ごはん・おかず：中央ではなく<tspan fill="#15803d" font-weight="bold">「端（ターンテーブルの外側）」</tspan>に置くと均一に温まります。</text>
  <text x="65" y="385" fill="#1e293b" font-size="12">2. 冷凍肉の解凍：出力切替ボタンで<tspan fill="#0284c7" font-weight="bold">「200W（解凍モード）」</tspan>を選んでください。</text>
  <text x="65" y="410" fill="#1e293b" font-size="12">3. ラップのかけ方：食品と密着させず、ふんわりとかけて両端にすき間を開けます。</text>
  <text x="65" y="440" fill="#b91c1c" font-size="12" font-weight="bold">※温めすぎると食品が焦げたり煙が出ます。少量の場合は時間を短めに設定してください。</text>
  <!-- Right: Control Panel Diagram -->
  <rect x="515" y="90" width="250" height="400" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="515" y="90" width="250" height="35" rx="10" fill="#0f172a"/>
  <text x="640" y="114" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">操作パネル (Control Panel)</text>
  <!-- Digital Display -->
  <rect x="535" y="140" width="210" height="50" rx="6" fill="#020617" stroke="#0ea5e9"/>
  <text x="640" y="172" fill="#38bdf8" font-size="24" font-family="monospace" font-weight="bold" text-anchor="middle">02:30 [600W]</text>
  <!-- Buttons Grid -->
  <rect x="535" y="205" width="100" height="38" rx="6" fill="#334155"/>
  <text x="585" y="228" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">あたため</text>
  <rect x="645" y="205" width="100" height="38" rx="6" fill="#334155"/>
  <text x="695" y="228" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">解凍(200W)</text>
  <rect x="535" y="255" width="100" height="38" rx="6" fill="#334155"/>
  <text x="585" y="278" fill="#ffffff" font-size="12" text-anchor="middle">強(800W)</text>
  <rect x="645" y="255" width="100" height="38" rx="6" fill="#334155"/>
  <text x="695" y="278" fill="#ffffff" font-size="12" text-anchor="middle">標準(600W)</text>
  <rect x="535" y="305" width="65" height="35" rx="6" fill="#475569"/>
  <text x="567" y="327" fill="#ffffff" font-size="11" text-anchor="middle">10分</text>
  <rect x="608" y="305" width="65" height="35" rx="6" fill="#475569"/>
  <text x="640" y="327" fill="#ffffff" font-size="11" text-anchor="middle">1分</text>
  <rect x="680" y="305" width="65" height="35" rx="6" fill="#475569"/>
  <text x="712" y="327" fill="#ffffff" font-size="11" text-anchor="middle">10秒</text>
  <!-- Big Start and Stop Buttons -->
  <rect x="535" y="360" width="100" height="50" rx="8" fill="#dc2626"/>
  <text x="585" y="390" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">取消 / 停止</text>
  <rect x="645" y="360" width="100" height="50" rx="8" fill="#16a34a"/>
  <text x="695" y="390" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">スタート</text>
  <rect x="535" y="425" width="210" height="50" rx="6" fill="#334155"/>
  <text x="545" y="445" fill="#facc15" font-size="11" font-weight="bold">【エコモード】</text>
  <text x="545" y="462" fill="#cbd5e1" font-size="10">待機電力をゼロにする自動OFF機能付</text>
</svg>