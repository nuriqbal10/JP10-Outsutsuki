  <text x="65" y="195" fill="#1e293b" font-size="13">• レディース・メンズ秋物ジャケット：<tspan fill="#b91c1c" font-weight="bold">30% OFF</tspan></text>
  <text x="65" y="218" fill="#1e293b" font-size="13">• ヒートテック防寒インナー：<tspan fill="#b91c1c" font-weight="bold">2着で ¥1,500</tspan> (1着¥980)</text>
  <text x="65" y="240" fill="#1e293b" font-size="13">• スニーカー・ビジネスシューズ：<tspan fill="#b91c1c" font-weight="bold">レジにて 20% OFF</tspan></text>
  <text x="65" y="265" fill="#4338ca" font-size="12" font-weight="bold">★ サクラポイントカードご提示で、ポイント3倍進呈！</text>
  <text x="65" y="282" fill="#64748b" font-size="11">（お忘れの場合は後日ポイント付与できませんのでご注意ください）</text>
