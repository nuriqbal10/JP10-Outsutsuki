  <text x="65" y="330" fill="#0f172a" font-size="13" font-weight="bold">📋 【商品の返品・交換に関する重要なお知らせ】</text>
  <text x="65" y="355" fill="#334155" font-size="12">① 返品・交換期間は、<tspan fill="#b91c1c" font-weight="bold">お買い上げ日より14日以内</tspan>です。</text>
  <text x="65" y="378" fill="#334155" font-size="12">② お買い上げ時の<tspan fill="#b91c1c" font-weight="bold">「レシート原本」と「商品タグ」</tspan>を必ずご持参ください。</text>
  <text x="65" y="401" fill="#334155" font-size="12">③ 一度ご着用・ご使用された商品、セール品の返品はお受けできません。</text>
  <text x="65" y="424" fill="#334155" font-size="12">④ クレジットカードでお支払いの場合は、利用したカードも必要です。</text>
  <text x="65" y="450" fill="#b91c1c" font-size="12" font-weight="bold">※サイズ違いによる交換は同一商品の在庫がある場合に限ります。</text>
