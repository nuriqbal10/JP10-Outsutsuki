  <text x="425" y="152" fill="#334155" font-size="13">● 日時：明日 10:00～11:00 (8:50集合)</text>
  <text x="425" y="180" fill="#b91c1c" font-size="14" font-weight="bold">● 場所変更：3階 会議室 → 2階 ロビー</text>
  <text x="425" y="206" fill="#64748b" font-size="12">※空調工事のため、場所が2階ロビーに変更になりました。</text>
  <text x="425" y="228" fill="#334155" font-size="12">● 担当：山田（総務部）</text>
  <rect x="425" y="240" width="320" height="24" rx="4" fill="#fee2e2"/>
  <text x="435" y="257" fill="#991b1b" font-size="12" font-weight="bold">※時間厳守でお願いいたします。</text>
