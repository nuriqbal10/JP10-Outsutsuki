  <text x="62" y="318" fill="#334155" font-size="13">「はじめまして！インドネシアの高原の町</text>
  <text x="62" y="340" fill="#334155" font-size="13">ウォノソボから参りました。お茶畑が</text>
  <text x="62" y="362" fill="#334155" font-size="13">たくさんある緑豊かで静かな町です。</text>
  <text x="62" y="392" fill="#0369a1" font-size="13" font-weight="600">先週、日本に来たばかりです。</text>
  <text x="62" y="416" fill="#334155" font-size="13">趣味は音楽鑑賞とサッカーです。</text>
  <text x="62" y="444" fill="#1e3a8a" font-size="13" font-weight="bold">早く仕事に慣れるよう頑張ります！」</text>
