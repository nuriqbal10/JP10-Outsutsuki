<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="auto" font-family="'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif">
  <rect x="10" y="10" width="780" height="500" rx="14" fill="#fdfbf7" stroke="#e2d9cc" stroke-width="2"/>
  <rect x="10" y="10" width="780" height="65" rx="14" fill="#0d9488"/>
  <text x="30" y="48" fill="#ffffff" font-size="22" font-weight="bold">【社内報】今月の注目スタッフ ＆ 職場マナー</text>
  <text x="760" y="48" fill="#ccfbf1" font-size="14" text-anchor="end">第2課 特集記事</text>
  <rect x="30" y="90" width="450" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="30" y="90" width="450" height="38" rx="10" fill="#f0fdfa"/>
  <text x="45" y="115" fill="#0f766e" font-size="16" font-weight="bold">📖 先輩社員インタビュー：モウさん（ミャンマー出身）</text>
  <circle cx="75" cy="170" r="30" fill="#99f6e4"/>
  <text x="75" y="180" font-size="28" text-anchor="middle">👩‍🔧</text>
  <text x="120" y="160" fill="#0f172a" font-size="15" font-weight="bold">モウ・サンダーさん（入社3年目）</text>
  <text x="120" y="182" fill="#64748b" font-size="12">出身地：ヤンゴン（金色のパゴダが有名で賑やかな大都市）</text>
  <rect x="45" y="215" width="420" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="55" y="235" fill="#0f766e" font-size="12" font-weight="bold">Ｑ：日本での日本語学習はどうしていますか？</text>
  <text x="55" y="255" fill="#334155" font-size="12">Ａ：「休みの日に市役所のボランティア教室に通ったり、テレビの</text>
  <text x="55" y="273" fill="#334155" font-size="12">ニュースやドラマを日本語字幕で見てシャドーイングしています。」</text>
  <rect x="45" y="295" width="420" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="55" y="315" fill="#0f766e" font-size="12" font-weight="bold">Ｑ：趣味や休日の過ごし方は？</text>
  <text x="55" y="335" fill="#334155" font-size="12">Ａ：「自然が好きなので、同僚と山登りやハイキングに行きます。</text>
  <text x="55" y="353" fill="#334155" font-size="12">日本の四季の景色を写真に撮るのが今の楽しみです。」</text>
  <text x="55" y="371" fill="#64748b" font-size="11">※日本でまだやったことのないスキーにもいつか挑戦してみたいです。</text>
  <rect x="45" y="390" width="420" height="85" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="55" y="410" fill="#166534" font-size="12" font-weight="bold">同僚からの評判：</text>
  <text x="55" y="430" fill="#1e293b" font-size="12">「いつも笑顔で礼儀正しく、とても真面目（まじめ）な方です。</text>
  <text x="55" y="450" fill="#1e293b" font-size="12">後輩の面倒見もよく、チームみんなから信頼されています。」</text>
  <rect x="500" y="90" width="270" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="500" y="90" width="270" height="38" rx="10" fill="#fef3c7"/>
  <text x="515" y="115" fill="#92400e" font-size="15" font-weight="bold">👔 職場の身だしなみチェック</text>
  <text x="515" y="150" fill="#1e293b" font-size="13" font-weight="bold">【工場・作業エリア】</text>
  <text x="515" y="172" fill="#475569" font-size="12">✓ 規定の作業着（長袖・長ズボン）</text>
  <text x="515" y="194" fill="#475569" font-size="12">✓ 安全靴・作業帽の着用</text>
  <text x="515" y="216" fill="#475569" font-size="12">✓ 髪が長い場合は後ろで束ねる</text>
  <line x1="515" y1="235" x2="755" y2="235" stroke="#f1f5f9" stroke-width="2"/>
  <text x="515" y="260" fill="#1e293b" font-size="13" font-weight="bold">【事務所・来客時】</text>
  <text x="515" y="282" fill="#475569" font-size="12">・清潔感のある服装</text>
  <text x="515" y="304" fill="#475569" font-size="12">・鈴木さん：長い黒髪・清楚なワンピース</text>
  <text x="515" y="326" fill="#475569" font-size="12">（外出時は赤色の日傘が目印）</text>
  <rect x="515" y="350" width="240" height="125" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="525" y="375" fill="#991b1b" font-size="13" font-weight="bold">⚠️ 健康管理メモ</text>
  <text x="525" y="398" fill="#334155" font-size="11">山田さんへ：</text>
  <text x="525" y="416" fill="#334155" font-size="11">最近残業が続き、顔色が悪そうです。</text>
  <text x="525" y="434" fill="#b91c1c" font-size="11" font-weight="bold">無理をせず、早めに休養を</text>
  <text x="525" y="452" fill="#b91c1c" font-size="11" font-weight="bold">取ってください。</text>
</svg>