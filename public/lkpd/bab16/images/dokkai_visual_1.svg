<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="auto" font-family="'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif">
  <rect x="10" y="10" width="780" height="500" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <rect x="10" y="10" width="780" height="65" rx="14" fill="#dc2626"/>
  <text x="30" y="48" fill="#ffffff" font-size="22" font-weight="bold">【防災・安全】地震避難マップ ＆ 非常用持ち出し品リスト</text>
  <text x="760" y="48" fill="#fee2e2" font-size="14" text-anchor="end">第16課：自然災害と避難</text>
  <!-- Map Box -->
  <rect x="35" y="90" width="460" height="400" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="35" y="90" width="460" height="38" rx="10" fill="#fee2e2"/>
  <text x="50" y="115" fill="#991b1b" font-size="15" font-weight="bold">🗺️ 地区防災避難マップ（さくら南地区）</text>
  <!-- Shelter Points -->
  <rect x="55" y="145" width="200" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="155" y="175" fill="#15803d" font-size="14" font-weight="bold" text-anchor="middle">🏫 さくら第一小学校 体育館</text>
  <text x="155" y="198" fill="#166534" font-size="12" font-weight="bold" text-anchor="middle">【第1次 指定避難所】</text>
  <text x="155" y="218" fill="#475569" font-size="11" text-anchor="middle">海抜 18m（津波安全エリア）</text>
  <text x="155" y="235" fill="#475569" font-size="11" text-anchor="middle">給水拠点・救急医務室あり</text>
  <rect x="275" y="145" width="200" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="375" y="175" fill="#92400e" font-size="14" font-weight="bold" text-anchor="middle">🌳 市民中央公園（広域避難場所）</text>
  <text x="375" y="198" fill="#b45309" font-size="12" text-anchor="middle">火災延焼時の緊急集合場所</text>
  <text x="375" y="218" fill="#475569" font-size="11" text-anchor="middle">テント設営エリア 200張</text>
  <text x="375" y="235" fill="#475569" font-size="11" text-anchor="middle">耐震性防火水槽完備</text>
  <!-- Evacuation route guidelines -->
  <rect x="55" y="260" width="420" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="285" fill="#0f172a" font-size="13" font-weight="bold">🚨 【地震が起きたときの行動（その瞬間）】</text>
  <text x="70" y="308" fill="#b91c1c" font-size="12" font-weight="bold">① まず頭を守る：</text>
  <text x="180" y="308" fill="#334155" font-size="12">頑丈な机の下に潜り、脚をしっかり握る。</text>
  <text x="70" y="330" fill="#b91c1c" font-size="12" font-weight="bold">② 火を消す：</text>
  <text x="180" y="330" fill="#334155" font-size="12">揺れが収まってからガスコンロ・ヒーターを止める。</text>
  <text x="70" y="352" fill="#b91c1c" font-size="12" font-weight="bold">③ ドアを開ける：</text>
  <text x="180" y="352" fill="#334155" font-size="12">出口を確保し、エレベーターは絶対に使わない！</text>
  <rect x="55" y="380" width="420" height="95" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="70" y="405" fill="#1e40af" font-size="13" font-weight="bold">📞 災害用伝言ダイヤル「171」</text>
  <text x="70" y="428" fill="#334155" font-size="12">電話が繋がりにくいときは「171」にダイヤルして声を録音：</text>
  <text x="70" y="448" fill="#1e40af" font-size="12" font-weight="bold">1 録音 ➔ 市外局番＋自宅番号 ➔ メッセージ録音</text>
  <text x="70" y="468" fill="#64748b" font-size="11">Web版「web171」でも安否確認が可能です。</text>
  <!-- Right: Emergency Bag Checklist -->
  <rect x="515" y="90" width="250" height="400" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="515" y="90" width="250" height="38" rx="10" fill="#fee2e2"/>
  <text x="530" y="115" fill="#991b1b" font-size="14" font-weight="bold">🎒 非常用持ち出し袋チェック</text>
  <text x="530" y="145" fill="#0f172a" font-size="12" font-weight="bold">【最優先・必携品】</text>
  <text x="530" y="168" fill="#334155" font-size="12">✓ 飲料水（1人1日3L × 最低3日分）</text>
  <text x="530" y="190" fill="#334155" font-size="12">✓ 非常食（缶詰・アルファ米・乾パン）</text>
  <text x="530" y="212" fill="#334155" font-size="12">✓ 懐中電灯・LEDランタン（予備電池）</text>
  <text x="530" y="234" fill="#334155" font-size="12">✓ モバイルバッテリー（手回し充電可）</text>
  <text x="530" y="256" fill="#334155" font-size="12">✓ 携帯ラジオ（AM/FM）</text>
  <line x1="530" y1="272" x2="745" y2="272" stroke="#f1f5f9" stroke-width="2"/>
  <text x="530" y="295" fill="#0f172a" font-size="12" font-weight="bold">【貴重品・衛生用品】</text>
  <text x="530" y="318" fill="#334155" font-size="12">✓ 在留カード・パスポート・保険証</text>
  <text x="530" y="340" fill="#334155" font-size="12">✓ 現金（公衆電話用10円玉・小銭）</text>
  <text x="530" y="362" fill="#334155" font-size="12">✓ 救急絆創膏・消毒液・常備薬</text>
  <text x="530" y="384" fill="#334155" font-size="12">✓ マスク・簡易トイレ・ウェットティッシュ</text>
  <rect x="525" y="405" width="230" height="70" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="535" y="425" fill="#b91c1c" font-size="11" font-weight="bold">※避難時は車を使わないこと！</text>
  <text x="535" y="445" fill="#7f1d1d" font-size="10">道路渋滞を引き起こし緊急車両の</text>
  <text x="535" y="460" fill="#7f1d1d" font-size="10">妨げになります。徒歩で避難してください。</text>
</svg>